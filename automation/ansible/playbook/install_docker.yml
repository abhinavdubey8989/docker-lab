---
- name: Install pinned Docker version on Ubuntu 24
  hosts: app_server:kafka_node
  become: yes

  vars:
    docker_version: "5:29.5.3-1~ubuntu.24.04~noble"
    docker_cli_version: "5:29.5.3-1~ubuntu.24.04~noble"
    docker_compose_version: "5.1.4-1~ubuntu.24.04~noble"

  tasks:

    # =========================
    # 1. Prerequisites
    # =========================
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install base dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    # =========================
    # 2. Add Docker GPG key + repo
    # =========================
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set correct permissions for Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    # =========================
    # 3. Install pinned Docker version
    # =========================
    - name: Install Docker Engine (pinned version)
      apt:
        name:
          - "docker-ce={{ docker_version }}"
          - "docker-ce-cli={{ docker_cli_version }}"
          - containerd.io
          - docker-buildx-plugin
        state: present

    - name: Install Docker Compose plugin (pinned)
      apt:
        name: "docker-compose-plugin={{ docker_compose_version }}"
        state: present

    # =========================
    # 4. Hold versions (prevent auto-upgrade)
    # =========================
    - name: Hold Docker packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

    # =========================
    # 5. Enable Docker service
    # =========================
    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # =========================
    # 6. Allow ubuntu to use Docker without sudo
    # =========================
    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Reset SSH connection for group change
      meta: reset_connection

# =========================
# 7. Verify Docker works (optional)
# =========================
- name: Verify Docker installation
  hosts: app_server:kafka_node
  become: no

  tasks:

    - name: Check Docker version
      command: docker --version
      changed_when: false

    - name: Check Docker Compose version
      command: docker compose version
      changed_when: false

    - name: Run docker ps
      command: docker ps
      changed_when: false