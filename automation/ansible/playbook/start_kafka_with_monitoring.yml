---
- name: Start/Stop prometheus node-exporter on inventory hosts
  hosts: kafka_node
  become: yes

  vars:
    repo_path: "/home/ubuntu/docker-lab"
    script_path: "{{ repo_path }}/scripts/start_stop.sh"
    compose_target: "kafka-kraft-single-node/docker-compose-host-nw.yml"

    # 0 = stop
    # 1 = start
    action: "1"

    # d = detach
    # a = attach
    mode: "d"

    # Kafka topic config
    kafka_topic: "user_login"
    kafka_container: "kafka"
    kafka_bootstrap_server: "localhost:9092"

  tasks:
    - name: Ensure script is executable
      file:
        path: "{{ script_path }}"
        mode: "0755"
        state: file

    - name: Execute docker compose start/stop script
      command: >
        {{ script_path }}
        --file={{ compose_target }}
        --action={{ action }}
        --mode={{ mode }}
      args:
        chdir: "{{ repo_path }}/scripts"
      become: yes
      become_user: ubuntu
      register: script_output

    - name: Display script stdout
      debug:
        var: script_output.stdout_lines

    - name: Display script stderr
      debug:
        var: script_output.stderr_lines
      when: script_output.stderr != ""

    - name: Wait for Kafka to be ready (simple delay)
      pause:
        seconds: 10

    - name: Create Kafka topic (if not exists)
      command: >
        docker exec -e KAFKA_OPTS=""
        {{ kafka_container }}
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server {{ kafka_bootstrap_server }}
        --create --if-not-exists
        --topic {{ kafka_topic }}
        --partitions 1
        --replication-factor 1
      become_user: ubuntu
      register: topic_create_output
      changed_when: "'Created topic' in topic_create_output.stdout"

    - name: Show topic creation output
      debug:
        var: topic_create_output.stdout_lines
