---
- name: Cleanup Prometheus TSDB using start_stop.sh + volume reset
  hosts: monitoring
  become: yes

  vars:
    repo_path: "/home/ubuntu/docker-lab"
    script_path: "{{ repo_path }}/scripts/start_stop.sh"
    prometheus_file: "prometheus-server"
    prometheus_volume: "prometheus-server_prometheus-data"

  tasks:
    - name: Stop Prometheus via start_stop script
      command: >
        {{ script_path }}
        --file={{ prometheus_file }}
        --action=0
        --mode=d
      args:
        chdir: "{{ repo_path }}/scripts"
      register: stop_output

    - name: Show stop output
      debug:
        var: stop_output.stdout_lines

    - name: Remove Prometheus data volume
      command: docker volume rm {{ prometheus_volume }}
      register: vol_rm
      failed_when: false
      changed_when: "'No such volume' not in vol_rm.stderr"

    - name: Show volume removal output
      debug:
        var: vol_rm.stderr_lines
