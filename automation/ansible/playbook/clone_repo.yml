---
- name: Clone GitHub repository to target nodes
  hosts: app_server:kafka_node
  become: yes

  vars:
    repo_url: "https://github.com/abhinavdubey8989/docker-lab.git"
    dest_path: "/home/ubuntu/docker-lab"
    branch: "main"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install git
      apt:
        name: git
        state: present

    - name: Clone or update GitHub repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ dest_path }}"
        version: "{{ branch }}"
        force: yes
        update: yes
      become: yes
      become_user: ubuntu   # run as ubuntu, not root