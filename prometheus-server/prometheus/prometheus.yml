global:
  scrape_interval: 30s
  scrape_timeout: 5s

scrape_configs:

  # -----------------------------
  # Node Exporter (EC2 hosts)
  # monitor host metrics (CPU, memory, disk, filesystem, network etc.)
  # -----------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "1.2.3.4:9100"
        labels:
          server: "server-a"

      - targets:
          - "1.2.3.5:9100"
        labels:
          server: "server-b"

  # -----------------------------
  # Kafka JMX Exporter
  # monitor Kafka-cluster JVM metrics, GC, memory, threads, and internal broker performance (via JMX)
  # -----------------------------
  - job_name: "kafka-jmx"
    static_configs:
      - targets:
          - "kafka:7071"
        labels:
          server: "json"

  # -----------------------------
  # Kafka Exporter
  # monitor Kafka-cluster : Consumer-lag, topic-offsets, partition-level consumption metrics etc.
  # -----------------------------
  - job_name: "kafka-exporter"
    static_configs:
      - targets:
          - "kafka-exporter:9308"
        labels:
          server: "json"

  # -----------------------------
  # Spring Boot Producer App
  # monitor application-level metrics like request latency, JVM metrics, custom business metrics, and Prometheus actuator metrics
  # -----------------------------
  - job_name: "kafka-producer-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "host.docker.internal:9111"
        labels:
          server: "json"

      - targets:
          - "producer:9111"
        labels:
          server: "avro"