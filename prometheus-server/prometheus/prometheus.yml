global:
  scrape_interval: 30s
  scrape_timeout: 5s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "1.2.3.4:9100"
        labels:
          server: "server-a"

      - targets:
          - "1.2.3.5:9100"
        labels:
          server: "server-b"

  - job_name: "kafka-jmx"
    static_configs:
      - targets:
          - "1.2.3.6:7071"

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          server: "json"

  # Custom Spring boot application
  - job_name: "kafka-producer-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9111"]
        labels:
          server: "json"
      - targets: ["producer:9111"]
        labels:
          server: "avro"
