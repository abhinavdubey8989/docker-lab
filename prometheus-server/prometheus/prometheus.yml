
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '1.2.3.4:9100'
        labels:
          server: 'server-a'

      - targets:
          - '1.2.3.5:9100'
        labels:
          server: 'server-b'

  - job_name: 'kafka-jmx'
    static_configs:
      - targets:
          - '1.2.3.6:7071'

  - job_name: 'kafka-exporter'
    static_configs:
      - targets:
          - '1.2.3.7:9308'